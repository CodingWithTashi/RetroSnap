<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;container-type:inline-size;border-radius:{{ radius }};overflow:hidden;background:{{ frameBg }};padding:{{ pad }};box-sizing:border-box;">
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:#1a1714;filter:{{ adj }};">
<img src="{{ src }}" alt="" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;">
<img src="{{ src }}" alt="" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:{{ look }};opacity:{{ lookOp }};">
<div style="position:absolute;inset:0;background:{{ tint }};mix-blend-mode:overlay;opacity:{{ tintOp }};"></div>
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, rgba(255,252,240,.95), rgba(255,252,240,0) 62%);mix-blend-mode:soft-light;opacity:{{ flashOp }};"></div>
<div style="position:absolute;inset:0;background:#FFF1E2;opacity:{{ fadeOp }};"></div>
<div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(255,40,70,.55), rgba(255,40,70,0) 22%, rgba(0,220,210,0) 78%, rgba(0,220,210,.55));mix-blend-mode:screen;opacity:{{ chromaOp }};"></div>
<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.45) 0px, rgba(0,0,0,.45) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);opacity:{{ scanOp }};"></div>
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(20,10,0,0) 48%, rgba(20,10,0,.9) 100%);opacity:{{ vigOp }};"></div>
<div style="position:absolute;inset:0;background:{{ warmColor }};mix-blend-mode:soft-light;opacity:{{ warmOp }};"></div>
<svg style="position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:overlay;opacity:{{ grainOp }};pointer-events:none;"><filter id="rsgrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#rsgrain)"></rect></svg>
<sc-if value="{{ showDate }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;right:6%;bottom:{{ stampBottom }};font-family:VT323,ui-monospace,monospace;font-size:max(9px, 7.5cqw);letter-spacing:.06em;color:#FF8A2A;text-shadow:0 0 4px rgba(255,110,20,.85), 0 0 1px #ffb070;opacity:.92;">'26 10 11</div>
</sc-if>
<sc-if value="{{ showVhs }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:6%;top:{{ stampTop }};font-family:VT323,ui-monospace,monospace;font-size:max(9px, 7cqw);color:#fff;text-shadow:2px 0 rgba(255,40,70,.7), -2px 0 rgba(0,220,210,.7);">PLAY ▶</div>
<div style="position:absolute;left:6%;right:6%;bottom:{{ stampBottom }};display:flex;justify-content:space-between;font-family:VT323,ui-monospace,monospace;font-size:max(9px, 6.5cqw);color:#fff;text-shadow:2px 0 rgba(255,40,70,.7), -2px 0 rgba(0,220,210,.7);"><span>OCT 11 2026</span><span>4:12 PM</span></div>
</sc-if>
<sc-if value="{{ video }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
<div style="width:18cqw;height:18cqw;max-width:72px;max-height:72px;min-width:28px;min-height:28px;border-radius:50%;background:rgba(14,13,12,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" style="width:45%;height:45%;margin-left:6%;" fill="#F4EEE6"><path d="M7 4.5v15l12.5-7.5z"></path></svg></div>
</div>
<div style="position:absolute;right:5%;top:5%;padding:2px 7px;border-radius:9px;background:rgba(14,13,12,.6);color:#F4EEE6;font:600 11px ui-rounded,'SF Pro Rounded',Nunito,system-ui,sans-serif;">{{ dur }}</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:400},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://picsum.photos/id/1015/600/800&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cam&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;film&quot;,&quot;disp&quot;,&quot;inst&quot;,&quot;digi&quot;,&quot;vhs&quot;],&quot;default&quot;:&quot;film&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;framed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;stamp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;intensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;},&quot;grain&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;},&quot;exposure&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-50,&quot;max&quot;:50,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;contrast&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-50,&quot;max&quot;:50,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;warmth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-50,&quot;max&quot;:50,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;video&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dur&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;stampBottom&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;stampTop&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
const LOOKS = {
  film: { f: 'sepia(.34) saturate(1.3) contrast(1.06) brightness(1.03) hue-rotate(-8deg)', tint: '#ff9a2e', t: .2, flash: 0, fade: 0, chroma: 0, scan: 0, vig: .6, grain: .26, stamp: 'date' },
  disp: { f: 'contrast(1.22) saturate(1.35) sepia(.16) brightness(1.13)', tint: '#ffcf5a', t: .18, flash: .7, fade: 0, chroma: 0, scan: 0, vig: .4, grain: .42, stamp: 'date' },
  inst: { f: 'contrast(.8) saturate(.74) sepia(.22) brightness(1.12)', tint: '#ffb9a0', t: .22, flash: 0, fade: .16, chroma: 0, scan: 0, vig: .22, grain: .14, stamp: '' },
  digi: { f: 'contrast(1.16) saturate(.86) brightness(1.06)', tint: '#3d7dff', t: .28, flash: .15, fade: 0, chroma: 0, scan: 0, vig: .08, grain: .08, stamp: 'date' },
  vhs: { f: 'saturate(1.5) contrast(.9) brightness(1.06) blur(.6px)', tint: '#20d0c0', t: .14, flash: 0, fade: .05, chroma: .5, scan: .4, vig: .32, grain: .22, stamp: 'vhs' }
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const L = LOOKS[p.cam] || LOOKS.film;
    const k = (p.intensity ?? 100) / 100;
    const g = (p.grain ?? 50) / 50;
    const e = p.exposure ?? 0, c = p.contrast ?? 0, w = p.warmth ?? 0;
    const framed = !!p.framed && p.cam === 'inst';
    const stamp = p.stamp !== false && p.stamp !== undefined;
    return {
      src: p.src,
      radius: p.radius || '0px',
      frameBg: framed ? '#F7F3EC' : 'transparent',
      pad: framed ? '5.5% 5.5% 22% 5.5%' : '0',
      adj: `brightness(${1 + e / 100}) contrast(${1 + c / 100})`,
      look: L.f, lookOp: k,
      tint: L.tint, tintOp: L.t * k,
      flashOp: L.flash * k, fadeOp: L.fade * k, chromaOp: L.chroma * k, scanOp: L.scan * k, vigOp: L.vig * k,
      grainOp: Math.min(1, L.grain * g * (0.4 + 0.6 * k)),
      warmColor: w >= 0 ? '#ff8a00' : '#2f6bff', warmOp: Math.abs(w) / 100,
      showDate: stamp && L.stamp === 'date' && k > 0.3,
      showVhs: stamp && L.stamp === 'vhs' && k > 0.3,
      stampBottom: p.stampBottom || '5%', stampTop: p.stampTop || '5%',
      video: !!p.video, dur: p.dur || '0:12'
    };
  }
}
</script>
</body>
</html>
